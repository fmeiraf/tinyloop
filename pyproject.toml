[project]
name = "tinyloop"
version = "0.1.4"
description = "A super lightweight library for LLM-based applications"
readme = "README.md"
authors = [{ name = "Fernando Meira", email = "fmeira.filho@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "langfuse>=3.3.2",
    "litellm>=1.75.9",
    "mlflow>=3.3.1",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]

[project.scripts]
tinyloop = "tinyloop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anthropic>=0.18.0",
    "ipykernel>=6.30.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dotenv>=1.1.1",
]

[project.urls]
repository = "https://github.com/fmeiraf/tinyloop"
